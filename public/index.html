<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Kali Terminal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/addon-fit.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#000;
  --topbar:#0d0d0d;
  --drawer-bg:#111;
  --drawer-border:#222;
  --key-bg:#1c1c1c;
  --key-border:#2c2c2c;
  --key-active:#0d2a0d;
  --green:#55ff55;
  --cyan:#8be9fd;
  --red:#ff5555;
  --yellow:#f1fa8c;
  --dim:#444;
  --text:#f8f8f2;
}

html,body{
  width:100%;height:100%;
  background:var(--bg);
  overflow:hidden;
  font-family:'Courier New',Courier,monospace;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}

/* ── App shell ─────────────────────────────────────────────── */
#app{
  display:flex;flex-direction:column;
  width:100%;height:100vh;height:100dvh;
  position:relative;overflow:hidden;
}

/* ── Top bar ──────────────────────────────────────────────── */
#topbar{
  display:flex;align-items:center;
  height:38px;flex-shrink:0;
  background:var(--topbar);
  border-bottom:1px solid #1e1e1e;
  padding:0 8px;
  z-index:10;
  position:relative;
}
#btn-menu{
  width:36px;height:36px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;cursor:pointer;flex-shrink:0;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
#btn-menu span{
  display:block;width:20px;height:2px;
  background:#888;border-radius:1px;
  transition:background .2s;
}
#btn-menu:active span{background:var(--green);}

#topbar-title{
  flex:1;text-align:center;
  font-size:13px;font-weight:700;
  color:var(--green);letter-spacing:1px;
  text-transform:uppercase;
  font-family:'Courier New',Courier,monospace;
}

#conn-indicator{
  width:8px;height:8px;border-radius:50%;
  background:var(--red);
  box-shadow:0 0 5px var(--red);
  margin-right:8px;flex-shrink:0;
  transition:background .4s,box-shadow .4s;
}
#conn-indicator.on{
  background:var(--green);
  box-shadow:0 0 6px var(--green);
}

#btn-settings{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;
  color:#666;flex-shrink:0;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
#btn-settings:active{color:var(--green);}

/* ── Terminal area ─────────────────────────────────────────── */
#term-area{
  flex:1;position:relative;overflow:hidden;
  background:var(--bg);
}

/* Kali dragon background */
#term-area::before{
  content:'';
  position:absolute;inset:0;
  background:url('kali-bg.jpeg') center center/cover no-repeat;
  opacity:.08;
  pointer-events:none;
  z-index:0;
}

#tinner{
  position:absolute;inset:0;
  padding:3px 4px;
  z-index:1;
}
.xterm{height:100%!important;}
.xterm-viewport{background:transparent!important;}
.xterm-screen{cursor:text!important;}

/* ── KEY ROWS ──────────────────────────────────────────────── */
#keybar{
  display:flex;align-items:center;
  height:46px;flex-shrink:0;
  background:#111;
  border-top:1px solid #1e1e1e;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  gap:3px;padding:4px 5px;
  z-index:5;
}
#keybar::-webkit-scrollbar{display:none;}

#numrow{
  display:flex;align-items:center;
  height:42px;flex-shrink:0;
  background:#0d0d0d;
  border-top:1px solid #181818;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  gap:3px;padding:3px 5px;
  padding-bottom:max(3px,env(safe-area-inset-bottom,3px));
  z-index:5;
}
#numrow::-webkit-scrollbar{display:none;}

/* ── Key button base ───────────────────────────────────────── */
.k{
  display:inline-flex;align-items:center;justify-content:center;
  flex:1;min-width:44px;height:36px;
  background:var(--key-bg);
  border:1px solid var(--key-border);
  border-bottom:2px solid #0a0a0a;
  border-radius:5px;
  font-size:11px;font-weight:700;
  font-family:'Courier New',Courier,monospace;
  color:#ccc;
  cursor:pointer;flex-shrink:0;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.k:active,.k.pressed{
  background:var(--key-active);
  color:var(--green);
  border-color:#1e4a1e;
  border-bottom-color:#061006;
}

/* CTRL / ALT modifier keys */
.k.mod{
  background:#131320;
  border-color:#22224a;
  color:#88aaff;
  min-width:50px;
}
.k.mod:active,.k.mod.pressed{
  background:#1a1a3a;
  color:#aaccff;
  border-color:#4466aa;
}
.k.mod.on{
  background:#1a2a4a;
  border-color:#4488cc;
  border-bottom-color:#0d1525;
  color:#66aaff;
  box-shadow:0 0 8px rgba(80,140,220,.35);
}

/* Number keys */
.k.num{
  background:#0a180a;
  border-color:#163016;
  color:var(--green);
  font-size:13px;
}
.k.num:active,.k.num.pressed{
  background:#102010;
  color:#88ff88;
  border-color:#33883;
}

/* Arrow keys */
.k.arr{
  font-size:17px;
  color:#888;
  background:#161616;
  border-color:#262626;
}
.k.arr:active,.k.arr.pressed{color:var(--yellow);border-color:#555200;background:#1e1c00;}

/* ── iOS hidden keyboard input ─────────────────────────────── */
#kb-input{
  position:fixed;
  /* Placed at bottom center so iOS can find it */
  bottom:0;left:0;right:0;
  height:1px;
  opacity:0;
  font-size:16px;/* CRITICAL: prevents iOS auto-zoom */
  border:none;outline:none;
  background:transparent;
  color:transparent;
  caret-color:transparent;
  pointer-events:none;/* re-enabled only at focus time */
  z-index:1;
  /* Must NOT be display:none or visibility:hidden */
  -webkit-appearance:none;
  resize:none;
  padding:0;
}

/* ── Sessions Drawer ───────────────────────────────────────── */
#drawer-mask{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  z-index:50;
  transition:opacity .25s;
  opacity:0;
}
#drawer-mask.open{display:block;opacity:1;}

#drawer{
  position:fixed;
  top:0;left:0;bottom:0;
  width:260px;
  background:var(--drawer-bg);
  border-right:1px solid var(--drawer-border);
  z-index:51;
  transform:translateX(-100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  overflow:hidden;
}
#drawer.open{transform:translateX(0);}

#drawer-header{
  padding:16px 14px 10px;
  border-bottom:1px solid #1e1e1e;
  flex-shrink:0;
}
#drawer-header h2{
  font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:#555;
  font-family:'Courier New',Courier,monospace;
}

#session-list{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:6px 0;
  scrollbar-width:thin;
  scrollbar-color:#222 transparent;
}
#session-list::-webkit-scrollbar{width:4px;}
#session-list::-webkit-scrollbar-thumb{background:#222;border-radius:2px;}

.session-item{
  display:flex;align-items:center;
  padding:10px 14px;
  gap:10px;cursor:pointer;
  border-left:3px solid transparent;
  transition:background .15s,border-color .15s;
  -webkit-user-select:none;user-select:none;
}
.session-item:active{background:#1a1a1a;}
.session-item.active{
  background:#141414;
  border-left-color:var(--green);
}
.session-item .s-dot{
  width:8px;height:8px;border-radius:50%;
  background:#333;flex-shrink:0;
  transition:background .3s,box-shadow .3s;
}
.session-item.active .s-dot,.session-item .s-dot.on{
  background:var(--green);
  box-shadow:0 0 5px var(--green);
}
.session-item .s-dot.dead{background:var(--red);box-shadow:0 0 5px var(--red);}
.session-item .s-name{
  flex:1;font-size:13px;color:#bbb;
  font-family:'Courier New',Courier,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.session-item.active .s-name{color:var(--green);}
.session-item .s-close{
  font-size:15px;color:#333;padding:2px 4px;
  transition:color .15s;flex-shrink:0;
}
.session-item:hover .s-close,.session-item:active .s-close{color:var(--red);}

#btn-new-session{
  display:flex;align-items:center;justify-content:center;
  gap:8px;margin:10px 12px 12px;
  padding:11px;
  background:#0a1a0a;
  border:1px dashed #1e4a1e;
  border-radius:6px;
  font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;
  color:var(--green);cursor:pointer;
  flex-shrink:0;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  font-family:'Courier New',Courier,monospace;
  transition:background .15s,border-color .15s;
}
#btn-new-session:active{background:#0d220d;border-color:var(--green);}

/* ── Settings bottom sheet ─────────────────────────────────── */
#settings-mask{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  z-index:60;
  opacity:0;transition:opacity .25s;
}
#settings-mask.open{display:block;opacity:1;}

#settings-sheet{
  position:fixed;
  bottom:0;left:0;right:0;
  background:#111;
  border-top:1px solid #222;
  border-radius:14px 14px 0 0;
  z-index:61;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0);
}
#settings-sheet.open{transform:translateY(0);}

#settings-handle{
  width:36px;height:4px;
  background:#333;border-radius:2px;
  margin:10px auto 6px;
}
#settings-title{
  text-align:center;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:#555;padding:4px 0 12px;
  font-family:'Courier New',Courier,monospace;
}

.settings-row{
  display:flex;align-items:center;
  padding:12px 20px;
  border-top:1px solid #1a1a1a;
  gap:12px;
}
.settings-label{
  flex:1;font-size:13px;color:#aaa;
  font-family:'Courier New',Courier,monospace;
}

/* Font size controls */
.sz-btn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  background:#1e1e1e;border:1px solid #2e2e2e;
  border-radius:6px;font-size:20px;font-weight:700;
  color:#888;cursor:pointer;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
.sz-btn:active{background:#252525;color:var(--green);}
#font-size-val{
  width:36px;text-align:center;
  font-size:14px;font-weight:700;
  color:#ddd;
  font-family:'Courier New',Courier,monospace;
}

/* Theme selector */
.theme-opt{
  padding:6px 14px;
  background:#1a1a1a;border:1px solid #2a2a2a;
  border-radius:20px;font-size:11px;font-weight:700;
  color:#666;cursor:pointer;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;letter-spacing:.5px;
  font-family:'Courier New',Courier,monospace;
  transition:background .15s,border-color .15s,color .15s;
}
.theme-opt.active{
  background:#0a200a;border-color:#2a6a2a;
  color:var(--green);
}
.theme-opt:active{background:#152215;}

/* Close settings */
#btn-close-settings{
  display:block;
  text-align:center;padding:14px;
  font-size:12px;letter-spacing:1px;text-transform:uppercase;
  color:#444;cursor:pointer;
  font-family:'Courier New',Courier,monospace;
  -webkit-user-select:none;user-select:none;
  border-top:1px solid #1a1a1a;
}
#btn-close-settings:active{color:#666;}
</style>
</head>
<body>

<div id="app">
  <!-- Top bar -->
  <div id="topbar">
    <div id="btn-menu" aria-label="Sessions">
      <span></span><span></span><span></span>
    </div>
    <div id="topbar-title">kali terminal</div>
    <div id="conn-indicator"></div>
    <div id="btn-settings" aria-label="Settings">⚙</div>
  </div>

  <!-- Terminal -->
  <div id="term-area">
    <div id="tinner"></div>
  </div>

  <!-- Extra key row (Termux-style) -->
  <div id="keybar">
    <div class="k"   id="k-esc">ESC</div>
    <div class="k"   id="k-tab">&#8677;</div>
    <div class="k mod" id="k-ctrl">CTRL</div>
    <div class="k mod" id="k-alt">ALT</div>
    <div class="k"   id="k-dash">-</div>
    <div class="k arr" id="k-up">↑</div>
    <div class="k arr" id="k-down">↓</div>
    <div class="k arr" id="k-left">←</div>
    <div class="k arr" id="k-right">→</div>
  </div>

  <!-- Number row -->
  <div id="numrow">
    <div class="k num" data-ch="1">1</div>
    <div class="k num" data-ch="2">2</div>
    <div class="k num" data-ch="3">3</div>
    <div class="k num" data-ch="4">4</div>
    <div class="k num" data-ch="5">5</div>
    <div class="k num" data-ch="6">6</div>
    <div class="k num" data-ch="7">7</div>
    <div class="k num" data-ch="8">8</div>
    <div class="k num" data-ch="9">9</div>
    <div class="k num" data-ch="0">0</div>
  </div>
</div>

<!-- iOS keyboard capture input — MUST NOT be display:none or visibility:hidden -->
<input id="kb-input" type="text"
  autocomplete="off" autocorrect="off"
  autocapitalize="none" spellcheck="false"
  inputmode="text" enterkeyhint="send"
  tabindex="-1"/>

<!-- Sessions drawer -->
<div id="drawer-mask"></div>
<div id="drawer" role="dialog" aria-label="Sessions">
  <div id="drawer-header"><h2>Sessions</h2></div>
  <div id="session-list"></div>
  <div id="btn-new-session">＋ &nbsp;New Session</div>
</div>

<!-- Settings sheet -->
<div id="settings-mask"></div>
<div id="settings-sheet" role="dialog" aria-label="Settings">
  <div id="settings-handle"></div>
  <div id="settings-title">Settings</div>

  <div class="settings-row">
    <span class="settings-label">Font Size</span>
    <div class="sz-btn" id="sz-minus">−</div>
    <div id="font-size-val">14</div>
    <div class="sz-btn" id="sz-plus">＋</div>
  </div>

  <div class="settings-row">
    <span class="settings-label">Theme</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <div class="theme-opt active" data-theme="kali">Kali</div>
      <div class="theme-opt" data-theme="matrix">Matrix</div>
      <div class="theme-opt" data-theme="dracula">Dracula</div>
    </div>
  </div>

  <div id="btn-close-settings">Close</div>
</div>

<script>
'use strict';

// ── Themes ────────────────────────────────────────────────────────────────────
var THEMES = {
  kali: {
    background: 'rgba(0,0,0,0.88)',
    foreground: '#f8f8f2', cursor: '#00ff41', cursorAccent: '#000',
    selectionBackground: 'rgba(85,255,85,0.2)',
    black:'#21222c', red:'#ff5555', green:'#55ff55', yellow:'#f1fa8c',
    blue:'#6272a4', magenta:'#ff79c6', cyan:'#8be9fd', white:'#f8f8f2',
    brightBlack:'#6272a4', brightRed:'#ff6e6e', brightGreen:'#69ff47',
    brightYellow:'#ffffa5', brightBlue:'#d6acff', brightMagenta:'#ff92df',
    brightCyan:'#a4ffff', brightWhite:'#ffffff',
  },
  matrix: {
    background: 'rgba(0,0,0,0.92)',
    foreground: '#00ff41', cursor: '#00ff41', cursorAccent: '#000',
    selectionBackground: 'rgba(0,255,65,0.2)',
    black:'#0d0d0d', red:'#cc0000', green:'#00ff41', yellow:'#aaff00',
    blue:'#007700', magenta:'#00aa44', cyan:'#00ffaa', white:'#aaffaa',
    brightBlack:'#005500', brightRed:'#ff4444', brightGreen:'#55ff55',
    brightYellow:'#ddff55', brightBlue:'#00aa22', brightMagenta:'#00cc66',
    brightCyan:'#55ffaa', brightWhite:'#ccffcc',
  },
  dracula: {
    background: 'rgba(40,42,54,0.92)',
    foreground: '#f8f8f2', cursor: '#f8f8f2', cursorAccent: '#282a36',
    selectionBackground: 'rgba(248,248,242,0.2)',
    black:'#21222c', red:'#ff5555', green:'#50fa7b', yellow:'#f1fa8c',
    blue:'#bd93f9', magenta:'#ff79c6', cyan:'#8be9fd', white:'#f8f8f2',
    brightBlack:'#6272a4', brightRed:'#ff6e6e', brightGreen:'#69ff47',
    brightYellow:'#ffffa5', brightBlue:'#d6acff', brightMagenta:'#ff92df',
    brightCyan:'#a4ffff', brightWhite:'#ffffff',
  },
};
var currentTheme = 'kali';
var fontSize = 14;

// ── State ─────────────────────────────────────────────────────────────────────
var sessions = [];     // { id, socket, tabId }
var activeSessionId = null;
var sessionN = 0;
var ctrlOn = false;
var altOn  = false;

// ── xterm instance (shared, swap content per session) ─────────────────────────
var term = new Terminal({
  cursorBlink:       true,
  cursorStyle:       'block',
  fontSize:          fontSize,
  fontFamily:        '"Courier New",Courier,monospace',
  lineHeight:        1.2,
  scrollback:        50000,
  allowTransparency: true,
  theme:             THEMES.kali,
  disableStdin:      false,
  convertEol:        false,
  macOptionIsMeta:   true,
});
var fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('tinner'));

function doFit() {
  try {
    fit.fit();
    var s = getActiveSession();
    if (s) s.socket.emit('resize', { cols: term.cols, rows: term.rows });
  } catch(e) {}
}

// Resize observers
var ro = new ResizeObserver(doFit);
ro.observe(document.getElementById('tinner'));
window.addEventListener('resize', doFit);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', doFit);
}

// xterm keyboard input (desktop path)
term.attachCustomKeyEventHandler(function(e) {
  if (e.type !== 'keydown') return true;
  if (ctrlOn) {
    if (e.key.length === 1) {
      var code = e.key.toUpperCase().charCodeAt(0) - 64;
      if (code >= 1 && code <= 26) sendStr(String.fromCharCode(code));
      else sendStr(e.key);
      setMod('ctrl', false);
      return false;
    }
    if (e.key === 'Enter')     { sendStr('\x0d'); setMod('ctrl',false); return false; }
    if (e.key === 'Backspace') { sendStr('\x08'); setMod('ctrl',false); return false; }
  }
  if (altOn) {
    if (e.key.length === 1) { sendStr('\x1b' + e.key); setMod('alt',false); return false; }
    if (e.key === 'Enter')  { sendStr('\x1b\x0d'); setMod('alt',false); return false; }
  }
  return true;
});

term.onData(function(data) {
  sendStr(data);
});

// ── Session management ────────────────────────────────────────────────────────
function getActiveSession() {
  return sessions.find(function(s){ return s.id === activeSessionId; }) || null;
}

function sendStr(str) {
  var s = getActiveSession();
  if (s && s.socket.connected) s.socket.emit('input', str);
}

function createSession() {
  sessionN++;
  var id = 'S' + sessionN;

  var socket = io({ transports: ['websocket', 'polling'], reconnectionAttempts: 15 });
  var sess = { id: id, socket: socket, name: 'bash ' + sessionN, connected: false };
  sessions.push(sess);

  socket.on('connect', function() {
    sess.connected = true;
    updateSessionUI(id, 'on');
    if (activeSessionId === id) {
      document.getElementById('conn-indicator').className = 'on';
      try { fit.fit(); socket.emit('resize', { cols: term.cols, rows: term.rows }); } catch(e) {}
    }
    focusKb();
  });

  socket.on('disconnect', function() {
    sess.connected = false;
    updateSessionUI(id, 'dead');
    if (activeSessionId === id) {
      document.getElementById('conn-indicator').className = '';
    }
  });

  socket.on('output', function(data) {
    if (activeSessionId === id) term.write(data);
  });

  renderDrawer();
  switchSession(id);
  return sess;
}

function switchSession(id) {
  activeSessionId = id;
  renderDrawer();
  var s = getActiveSession();
  if (s) {
    document.getElementById('conn-indicator').className = s.connected ? 'on' : '';
    try { fit.fit(); s.socket.emit('resize', { cols: term.cols, rows: term.rows }); } catch(e) {}
  }
  // Clear terminal for new session view
  term.clear();
  focusKb();
}

function killSession(id) {
  if (sessions.length <= 1) return;
  var idx = sessions.findIndex(function(s){ return s.id === id; });
  if (idx < 0) return;
  try { sessions[idx].socket.disconnect(); } catch(e) {}
  sessions.splice(idx, 1);
  if (activeSessionId === id) {
    switchSession(sessions[Math.max(0, idx - 1)].id);
  } else {
    renderDrawer();
  }
}

function updateSessionUI(id, state) {
  var el = document.querySelector('.session-item[data-id="' + id + '"] .s-dot');
  if (el) el.className = 's-dot ' + state;
}

function renderDrawer() {
  var list = document.getElementById('session-list');
  list.innerHTML = '';
  sessions.forEach(function(s) {
    var item = document.createElement('div');
    item.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
    item.dataset.id = s.id;
    item.innerHTML =
      '<div class="s-dot ' + (s.connected ? 'on' : 'dead') + '"></div>' +
      '<div class="s-name">' + s.name + '</div>' +
      (sessions.length > 1 ? '<div class="s-close" data-id="' + s.id + '">✕</div>' : '');

    item.addEventListener('click', function(e) {
      if (e.target.classList.contains('s-close')) {
        killSession(e.target.dataset.id);
        return;
      }
      switchSession(s.id);
      closeDrawer();
    });
    list.appendChild(item);
  });
}

// ── Drawer open / close ───────────────────────────────────────────────────────
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-mask').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-mask').classList.remove('open');
}
function toggleDrawer() {
  var open = document.getElementById('drawer').classList.contains('open');
  if (open) closeDrawer(); else openDrawer();
}

document.getElementById('btn-menu').addEventListener('touchstart', function(e) {
  e.preventDefault(); toggleDrawer();
}, { passive: false });
document.getElementById('btn-menu').addEventListener('mousedown', function(e) {
  e.preventDefault(); toggleDrawer();
});
document.getElementById('drawer-mask').addEventListener('touchstart', function(e) {
  e.preventDefault(); closeDrawer();
}, { passive: false });
document.getElementById('drawer-mask').addEventListener('mousedown', function() {
  closeDrawer();
});
document.getElementById('btn-new-session').addEventListener('touchstart', function(e) {
  e.preventDefault(); createSession(); closeDrawer();
}, { passive: false });
document.getElementById('btn-new-session').addEventListener('mousedown', function(e) {
  e.preventDefault(); createSession(); closeDrawer();
});

// ── Settings ──────────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settings-sheet').classList.add('open');
  document.getElementById('settings-mask').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-sheet').classList.remove('open');
  document.getElementById('settings-mask').classList.remove('open');
}

document.getElementById('btn-settings').addEventListener('touchstart', function(e) {
  e.preventDefault(); openSettings();
}, { passive: false });
document.getElementById('btn-settings').addEventListener('mousedown', function(e) {
  e.preventDefault(); openSettings();
});
document.getElementById('settings-mask').addEventListener('touchstart', function(e) {
  e.preventDefault(); closeSettings();
}, { passive: false });
document.getElementById('settings-mask').addEventListener('mousedown', function() {
  closeSettings();
});
document.getElementById('btn-close-settings').addEventListener('touchstart', function(e) {
  e.preventDefault(); closeSettings();
}, { passive: false });
document.getElementById('btn-close-settings').addEventListener('mousedown', function() {
  closeSettings();
});

// Font size
function applyFontSize(sz) {
  fontSize = Math.max(8, Math.min(24, sz));
  document.getElementById('font-size-val').textContent = fontSize;
  term.options.fontSize = fontSize;
  doFit();
}

document.getElementById('sz-minus').addEventListener('touchstart', function(e) {
  e.preventDefault(); applyFontSize(fontSize - 1);
}, { passive: false });
document.getElementById('sz-minus').addEventListener('mousedown', function(e) {
  e.preventDefault(); applyFontSize(fontSize - 1);
});
document.getElementById('sz-plus').addEventListener('touchstart', function(e) {
  e.preventDefault(); applyFontSize(fontSize + 1);
}, { passive: false });
document.getElementById('sz-plus').addEventListener('mousedown', function(e) {
  e.preventDefault(); applyFontSize(fontSize + 1);
});

// Theme
document.querySelectorAll('.theme-opt').forEach(function(opt) {
  function applyTheme() {
    currentTheme = opt.dataset.theme;
    document.querySelectorAll('.theme-opt').forEach(function(o) {
      o.classList.toggle('active', o.dataset.theme === currentTheme);
    });
    term.options.theme = THEMES[currentTheme];
  }
  opt.addEventListener('touchstart', function(e) { e.preventDefault(); applyTheme(); }, { passive: false });
  opt.addEventListener('mousedown',  function(e) { e.preventDefault(); applyTheme(); });
});

// ── Modifier key state ────────────────────────────────────────────────────────
function setMod(which, val) {
  if (which === 'ctrl') {
    ctrlOn = val;
    document.getElementById('k-ctrl').classList.toggle('on', val);
    if (val) { altOn = false; document.getElementById('k-alt').classList.remove('on'); }
  } else {
    altOn = val;
    document.getElementById('k-alt').classList.toggle('on', val);
    if (val) { ctrlOn = false; document.getElementById('k-ctrl').classList.remove('on'); }
  }
}

// ── iOS Keyboard bridge ───────────────────────────────────────────────────────
var kb = document.getElementById('kb-input');
var kbLast = '';

function focusKb() {
  // Enable pointer-events briefly so iOS can focus it
  kb.style.pointerEvents = 'auto';
  kb.focus();
  kb.style.pointerEvents = 'none';
}

kb.addEventListener('focus', function() {
  kbLast = kb.value = '';
});

kb.addEventListener('input', function() {
  var cur = kb.value;
  var diff = cur.length - kbLast.length;

  if (diff > 0) {
    // Characters added
    var added = cur.slice(kbLast.length);
    if (ctrlOn) {
      // Apply ctrl modifier to first character
      var ch = added[0].toUpperCase();
      var code = ch.charCodeAt(0) - 64;
      if (code >= 1 && code <= 26) sendStr(String.fromCharCode(code));
      else sendStr(added[0]);
      if (added.length > 1) sendStr(added.slice(1));
      setMod('ctrl', false);
    } else if (altOn) {
      sendStr('\x1b' + added[0]);
      if (added.length > 1) sendStr(added.slice(1));
      setMod('alt', false);
    } else {
      sendStr(added);
    }
  } else if (diff < 0) {
    // Characters removed (soft keyboard backspace)
    for (var i = 0; i < -diff; i++) sendStr('\x7f');
  }
  kbLast = kb.value = cur;
  // Don't reset — track actual accumulated value
}, false);

kb.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    sendStr('\r');
    kbLast = kb.value = '';
  } else if (e.key === 'Tab') {
    e.preventDefault();
    sendStr('\t');
  } else if (e.key === 'Escape') {
    e.preventDefault();
    sendStr('\x1b');
  } else if (e.key === 'Backspace') {
    // Let input event handle this (it detects length decrease)
    // But on iOS hardware keyboard, we need to handle it here too
    if (e.isTrusted && !e.isComposing) {
      // Only if it's from hardware keyboard (iOS sometimes fires both)
      // We'll let the value change and input event to detect it
    }
  }
}, false);

// ── Tap terminal → focus keyboard (iOS) ───────────────────────────────────────
document.getElementById('term-area').addEventListener('touchstart', function(e) {
  // MUST be direct call, NO setTimeout, for iOS keyboard to appear
  var target = e.target;
  // Don't steal focus from toolbar buttons
  if (target.closest && target.closest('.k')) return;
  focusKb();
}, { passive: true });

document.getElementById('term-area').addEventListener('click', function() {
  // Desktop: also try xterm focus
  term.focus();
  focusKb();
});

// ── Physical key bar buttons ──────────────────────────────────────────────────
function bindBtn(id, action) {
  var el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', function(e) {
    e.preventDefault();
    el.classList.add('pressed');
    action();
  }, { passive: false });
  el.addEventListener('touchend', function() {
    el.classList.remove('pressed');
  }, { passive: true });
  el.addEventListener('mousedown', function(e) {
    e.preventDefault();
    el.classList.add('pressed');
    action();
  });
  el.addEventListener('mouseup', function() {
    el.classList.remove('pressed');
  });
}

bindBtn('k-esc',   function() { sendStr('\x1b');   focusKb(); });
bindBtn('k-tab',   function() { sendStr('\t');     focusKb(); });
bindBtn('k-dash',  function() { sendStr('-');      focusKb(); });
bindBtn('k-up',    function() { sendStr('\x1b[A'); focusKb(); });
bindBtn('k-down',  function() { sendStr('\x1b[B'); focusKb(); });
bindBtn('k-left',  function() { sendStr('\x1b[D'); focusKb(); });
bindBtn('k-right', function() { sendStr('\x1b[C'); focusKb(); });

bindBtn('k-ctrl', function() {
  setMod('ctrl', !ctrlOn);
  focusKb();
});
bindBtn('k-alt', function() {
  setMod('alt', !altOn);
  focusKb();
});

// Number row
document.querySelectorAll('#numrow .k').forEach(function(el) {
  el.addEventListener('touchstart', function(e) {
    e.preventDefault();
    el.classList.add('pressed');
    var ch = el.dataset.ch;
    if (ctrlOn) {
      sendStr(String.fromCharCode(ch.charCodeAt(0)));
      setMod('ctrl', false);
    } else {
      sendStr(ch);
    }
    focusKb();
  }, { passive: false });
  el.addEventListener('touchend', function() { el.classList.remove('pressed'); }, { passive: true });
  el.addEventListener('mousedown', function(e) {
    e.preventDefault();
    el.classList.add('pressed');
    sendStr(el.dataset.ch);
    focusKb();
  });
  el.addEventListener('mouseup', function() { el.classList.remove('pressed'); });
});

// ── Boot ──────────────────────────────────────────────────────────────────────
createSession();
setTimeout(function() {
  doFit();
  focusKb();
}, 150);
</script>
