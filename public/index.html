<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<title>Kali Terminal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/addon-fit.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Courier New',Courier,monospace;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* ── Kali dragon watermark ─────────────────────────────────────────── */
body::before{
  content:'';
  position:fixed;inset:0;
  background:url('kali-bg.jpeg') center center/cover no-repeat;
  opacity:.13;
  pointer-events:none;
  z-index:0;
}

/* ── App shell ─────────────────────────────────────────────────────── */
#app{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  width:100%;height:100vh;height:100dvh;
}

/* ── Top bar (like Termux title bar) ──────────────────────────────── */
#topbar{
  display:flex;align-items:center;
  height:30px;
  padding:0 8px;
  background:#000;
  border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
  gap:6px;
}
#tabs-scroll{
  display:flex;flex:1;align-items:stretch;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;gap:0;
}
#tabs-scroll::-webkit-scrollbar{display:none;}
.tab{
  display:flex;align-items:center;gap:4px;
  padding:0 10px;
  min-width:80px;max-width:130px;
  font-size:12px;color:#555;
  cursor:pointer;white-space:nowrap;
  border-right:1px solid #111;
  flex-shrink:0;height:30px;
  user-select:none;-webkit-user-select:none;
}
.tab.active{color:#fff;background:#111;border-bottom:2px solid #0f0;}
.tab .dot{width:5px;height:5px;border-radius:50%;background:#333;flex-shrink:0;}
.tab.active .dot{background:#0f0;}
.tab .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;}
.tab .cls{
  font-size:14px;color:#333;padding:0 3px;
  line-height:1;border-radius:2px;
}
.tab .cls:hover,.tab .cls:active{color:#f44;}
#btn-add{
  display:flex;align-items:center;justify-content:center;
  width:30px;min-width:30px;height:30px;
  font-size:20px;color:#333;cursor:pointer;
  border-left:1px solid #111;
  user-select:none;-webkit-user-select:none;
}
#btn-add:active{color:#0f0;background:#0a0a0a;}
#conn-led{
  width:6px;height:6px;border-radius:50%;
  background:#333;flex-shrink:0;
  margin-left:auto;
}
#conn-led.on{background:#0f0;}
#conn-led.err{background:#f44;}

/* ── Terminal area ─────────────────────────────────────────────────── */
#terms{
  flex:1;position:relative;overflow:hidden;
  background:#000;
}
.pane{
  display:none;position:absolute;inset:0;
  flex-direction:column;
}
.pane.active{display:flex;}
.inner{
  flex:1;overflow:hidden;
  padding:2px 2px 0 4px;
}

/* xterm transparent so dragon watermark shows */
.xterm{height:100%!important;}
.xterm-viewport{background:transparent!important;}

/* ── Keyboard toolbar ──────────────────────────────────────────────── */
#kbd{
  display:flex;flex-direction:column;
  background:#000;
  border-top:1px solid #1a1a1a;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.row{
  display:flex;align-items:center;
  height:40px;gap:2px;padding:2px 3px;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
}
.row::-webkit-scrollbar{display:none;}

/* base key */
.k{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:40px;height:36px;padding:0 5px;
  background:#111;border:1px solid #1e1e1e;border-radius:4px;
  color:#ccc;font-size:11px;font-weight:bold;
  font-family:'Courier New',Courier,monospace;
  cursor:pointer;flex-shrink:0;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.k:active,.k.p{background:#1a1a1a;color:#0f0;border-color:#0f0;}

/* ctrl/esc/tab style */
.k.c{min-width:48px;color:#0af;border-color:#0a1e1e;background:#050f0f;}
.k.c:active,.k.c.p{background:#091515;color:#fff;border-color:#0af;}

/* arrow */
.k.a{min-width:36px;font-size:16px;color:#888;}
.k.a:active,.k.a.p{color:#0f0;border-color:#0f0;}

/* number */
.k.n{min-width:34px;font-size:13px;color:#0f0;background:#050f05;border-color:#0a1a0a;}
.k.n:active,.k.n.p{background:#091509;border-color:#0f0;}

/* ── hidden input (iOS keyboard trigger) ──────────────────────────── */
#hid{
  position:fixed;top:-300px;left:0;
  width:100%;height:1px;opacity:0;
  font-size:16px;
  border:none;outline:none;
}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="tabs-scroll"></div>
    <div id="btn-add">+</div>
    <div id="conn-led"></div>
  </div>

  <div id="terms"></div>

  <div id="kbd">
    <div class="row">
      <div class="k c" data-s="esc">ESC</div>
      <div class="k c" data-s="tab">TAB</div>
      <div class="k c" data-s="ctrl-c">C-c</div>
      <div class="k c" data-s="ctrl-d">C-d</div>
      <div class="k c" data-s="ctrl-z">C-z</div>
      <div class="k c" data-s="ctrl-l">C-l</div>
      <div class="k c" data-s="ctrl-a">C-a</div>
      <div class="k c" data-s="ctrl-e">C-e</div>
      <div class="k c" data-s="ctrl-k">C-k</div>
      <div class="k c" data-s="ctrl-u">C-u</div>
      <div class="k c" data-s="ctrl-w">C-w</div>
      <div class="k c" data-s="ctrl-r">C-r</div>
      <div class="k a" data-s="up">↑</div>
      <div class="k a" data-s="down">↓</div>
      <div class="k a" data-s="left">←</div>
      <div class="k a" data-s="right">→</div>
    </div>
    <div class="row">
      <div class="k n" data-i="1">1</div>
      <div class="k n" data-i="2">2</div>
      <div class="k n" data-i="3">3</div>
      <div class="k n" data-i="4">4</div>
      <div class="k n" data-i="5">5</div>
      <div class="k n" data-i="6">6</div>
      <div class="k n" data-i="7">7</div>
      <div class="k n" data-i="8">8</div>
      <div class="k n" data-i="9">9</div>
      <div class="k n" data-i="0">0</div>
      <div class="k" data-i="-">-</div>
      <div class="k" data-i="_">_</div>
      <div class="k" data-i="/">/</div>
      <div class="k" data-i="|">|</div>
      <div class="k" data-i="&amp;">&amp;</div>
      <div class="k" data-i="~">~</div>
      <div class="k" data-i="`">`</div>
      <div class="k" data-i="$">$</div>
      <div class="k" data-i="@">@</div>
      <div class="k" data-i="#">#</div>
      <div class="k" data-i="!">!</div>
      <div class="k" data-i="*">*</div>
      <div class="k" data-i="(">( </div>
      <div class="k" data-i=")">)</div>
      <div class="k" data-i="[">[ </div>
      <div class="k" data-i="]">]</div>
      <div class="k" data-i="{">{</div>
      <div class="k" data-i="}">}</div>
      <div class="k" data-i="&quot;">"</div>
      <div class="k" data-i="'">'</div>
      <div class="k" data-i=";">;</div>
      <div class="k" data-i=":">:</div>
      <div class="k" data-i=",">,</div>
      <div class="k" data-i=".">.</div>
      <div class="k" data-i="=">=</div>
      <div class="k" data-i=" ">SPC</div>
    </div>
  </div>
</div>

<input id="hid" type="text" inputmode="text"
  autocomplete="off" autocorrect="off"
  autocapitalize="none" spellcheck="false"/>

<script>
var tabs=[], activeId=null, tabN=0;

var THEME={
  background:'#000000',
  foreground:'#f0f0f0',
  cursor:'#00ff00',
  cursorAccent:'#000',
  selectionBackground:'rgba(0,255,0,0.25)',
  black:'#000',    red:'#ff5555',
  green:'#55ff55', yellow:'#ffff55',
  blue:'#5555ff',  magenta:'#ff55ff',
  cyan:'#55ffff',  white:'#f0f0f0',
  brightBlack:'#555',   brightRed:'#ff8888',
  brightGreen:'#88ff88',brightYellow:'#ffff88',
  brightBlue:'#8888ff', brightMagenta:'#ff88ff',
  brightCyan:'#88ffff', brightWhite:'#ffffff',
};

/* ── create tab ─────────────────────────────────────────────────── */
function newTab(){
  tabN++;
  var id='T'+tabN;

  var pane=document.createElement('div');
  pane.className='pane';pane.id='pane-'+id;
  var inner=document.createElement('div');
  inner.className='inner';inner.id='inner-'+id;
  pane.appendChild(inner);
  document.getElementById('terms').appendChild(pane);

  var tabEl=document.createElement('div');
  tabEl.className='tab';tabEl.id='tab-'+id;
  tabEl.innerHTML='<div class="dot"></div><span class="lbl">bash:'+tabN+'</span><span class="cls" data-id="'+id+'">✕</span>';
  tabEl.addEventListener('click',function(e){
    if(e.target.classList.contains('cls'))return;
    showTab(id);
  });
  tabEl.querySelector('.cls').addEventListener('click',function(){killTab(id);});
  document.getElementById('tabs-scroll').appendChild(tabEl);

  var term=new Terminal({
    cursorBlink:true,cursorStyle:'block',
    fontSize:13,
    fontFamily:'"Courier New",Courier,monospace',
    lineHeight:1.2,
    scrollback:50000,
    allowTransparency:true,
    theme:THEME,
    convertEol:false,
    disableStdin:false,
  });
  var fit=new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(inner);

  var socket=io({transports:['websocket','polling'],reconnectionAttempts:10});
  var led=document.getElementById('conn-led');

  socket.on('connect',function(){
    led.className='on';
    try{fit.fit();socket.emit('resize',{cols:term.cols,rows:term.rows});}catch(e){}
    term.focus();
  });
  socket.on('disconnect',function(){led.className='err';});
  socket.on('output',function(d){term.write(d);});
  term.onData(function(d){socket.emit('input',d);});

  var doFit=function(){
    if(activeId!==id)return;
    try{fit.fit();socket.emit('resize',{cols:term.cols,rows:term.rows});}catch(e){}
  };
  setTimeout(doFit,100);
  var ro=new ResizeObserver(doFit);
  ro.observe(inner);

  inner.addEventListener('click',focus_);
  inner.addEventListener('touchend',focus_,{passive:true});

  var obj={id:id,term:term,fit:fit,socket:socket,pane:pane,tabEl:tabEl,ro:ro};
  tabs.push(obj);
  showTab(id);
  return obj;
}

/* ── switch / close ─────────────────────────────────────────────── */
function showTab(id){
  activeId=id;
  tabs.forEach(function(t){
    var on=t.id===id;
    t.pane.classList.toggle('active',on);
    t.tabEl.classList.toggle('active',on);
    if(on)setTimeout(function(){
      try{t.fit.fit();t.socket.emit('resize',{cols:t.term.cols,rows:t.term.rows});t.term.focus();}catch(e){}
    },50);
  });
  var el=document.getElementById('tab-'+id);
  if(el)el.scrollIntoView({behavior:'smooth',inline:'nearest'});
}

function killTab(id){
  if(tabs.length<=1)return;
  var idx=tabs.findIndex(function(t){return t.id===id;});
  if(idx<0)return;
  var t=tabs[idx];
  try{t.socket.disconnect();}catch(e){}
  t.ro.disconnect();
  t.pane.remove();t.tabEl.remove();
  tabs.splice(idx,1);
  if(activeId===id)showTab(tabs[Math.min(idx,tabs.length-1)].id);
}

function cur(){return tabs.find(function(t){return t.id===activeId;});}

/* ── keyboard map ───────────────────────────────────────────────── */
var KMAP={
  esc:'\x1b',tab:'\t',
  'ctrl-c':'\x03','ctrl-d':'\x04','ctrl-z':'\x1a',
  'ctrl-l':'\x0c','ctrl-a':'\x01','ctrl-e':'\x05',
  'ctrl-k':'\x0b','ctrl-u':'\x15','ctrl-w':'\x17','ctrl-r':'\x12',
  up:'\x1b[A',down:'\x1b[B',right:'\x1b[C',left:'\x1b[D',
};

function sendKey(el){
  var t=cur();if(!t)return;
  var s=el.dataset.s,i=el.dataset.i;
  if(s!==undefined)t.socket.emit('input',KMAP[s]||'');
  else if(i!==undefined)t.socket.emit('input',i);
  t.term.focus();
}

document.querySelectorAll('.k').forEach(function(el){
  el.addEventListener('touchstart',function(e){
    e.preventDefault();el.classList.add('p');sendKey(el);
  },{passive:false});
  el.addEventListener('touchend',function(){el.classList.remove('p');},{passive:true});
  el.addEventListener('mousedown',function(e){e.preventDefault();el.classList.add('p');sendKey(el);});
  el.addEventListener('mouseup',function(){el.classList.remove('p');});
});

document.getElementById('btn-add').addEventListener('click',newTab);
document.getElementById('btn-add').addEventListener('touchend',function(e){e.preventDefault();newTab();});

/* ── iOS keyboard (hidden input trick) ─────────────────────────── */
var hid=document.getElementById('hid');
function focus_(){
  var t=cur();if(!t)return;
  t.term.focus();
  hid.focus();
}

hid.addEventListener('keydown',function(e){
  var t=cur();if(!t)return;
  if(e.key==='Enter'){e.preventDefault();t.socket.emit('input','\r');hid.value='';}
  else if(e.key==='Backspace'){e.preventDefault();t.socket.emit('input','\x7f');hid.value='';}
  else if(e.key==='Tab'){e.preventDefault();t.socket.emit('input','\t');}
  else if(e.key==='Escape'){e.preventDefault();t.socket.emit('input','\x1b');}
  else if(e.ctrlKey&&e.key.length===1){
    e.preventDefault();
    t.socket.emit('input',String.fromCharCode(e.key.toUpperCase().charCodeAt(0)-64));
  }
});
hid.addEventListener('input',function(){
  var t=cur();if(!t)return;
  if(hid.value){t.socket.emit('input',hid.value);hid.value='';}
});

document.getElementById('terms').addEventListener('click',focus_);
document.getElementById('terms').addEventListener('touchend',focus_,{passive:true});

window.addEventListener('resize',function(){
  var t=cur();if(!t)return;
  try{t.fit.fit();t.socket.emit('resize',{cols:t.term.cols,rows:t.term.rows});}catch(e){}
});

/* ── boot ───────────────────────────────────────────────────────── */
newTab();
</script>
</body>
</html>
