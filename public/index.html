<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Kali Terminal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/addon-fit.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

#app {
  display: flex; flex-direction: column;
  width: 100%;
  height: 100vh; height: 100dvh;
}

/* ── Terminal fills all space ─────────────────────────────── */
#terminal {
  flex: 1;
  overflow: hidden;
  background: #000;
  cursor: text;
}
.tinner { width: 100%; height: 100%; padding: 4px; }

.xterm { height: 100% !important; }
.xterm-viewport { background: transparent !important; }
.xterm-screen { cursor: text !important; }

/* ── Extra key row (Termux style) ─────────────────────────── */
#keybar {
  display: flex;
  height: 46px; flex-shrink: 0;
  background: #1a1a1a;
  border-top: 1px solid #2a2a2a;
  align-items: center;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  gap: 2px; padding: 4px 4px;
}
#keybar::-webkit-scrollbar { display: none; }

/* ── Number row ───────────────────────────────────────────── */
#numrow {
  display: flex;
  height: 42px; flex-shrink: 0;
  background: #141414;
  border-top: 1px solid #222;
  align-items: center;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  gap: 2px; padding: 4px 4px;
  padding-bottom: max(4px, env(safe-area-inset-bottom, 4px));
}
#numrow::-webkit-scrollbar { display: none; }

/* ── Key buttons ──────────────────────────────────────────── */
.k {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 48px; height: 34px; flex: 1;
  background: #2a2a2a;
  border: 1px solid #3a3a3a;
  border-bottom: 2px solid #111;
  border-radius: 4px;
  font-size: 12px; font-weight: 700;
  font-family: 'Courier New', Courier, monospace;
  color: #ddd;
  cursor: pointer; flex-shrink: 0;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .08s, color .08s;
}
.k:active {
  background: #3a3a3a; color: #fff;
  border-bottom-width: 1px;
}

/* Number keys — green tint like Termux */
.k.num {
  background: #1a2a1a;
  border-color: #2a3a2a;
  border-bottom-color: #0a100a;
  color: #88ff88;
  font-size: 13px;
}
.k.num:active { background: #243424; color: #aaffaa; }

/* Modifier keys (CTRL, ALT) */
.k.mod {
  background: #1a1a2a;
  border-color: #2a2a3a;
  color: #88aaff;
}
.k.mod:active { background: #242438; }
/* Active/toggled state */
.k.mod.on {
  background: #2a3a5a;
  border-color: #4466aa;
  border-bottom-color: #223;
  color: #aaccff;
  box-shadow: 0 0 6px rgba(100,160,255,0.4);
}

/* Arrow keys */
.k.arrow {
  background: #1e1e1e;
  border-color: #2e2e2e;
  color: #aaa;
  font-size: 16px;
}
.k.arrow:active { color: #fff; background: #282828; }
</style>
</head>
<body>
<div id="app">
  <div id="terminal">
    <div class="tinner" id="tinner"></div>
  </div>

  <!-- Termux-style extra key row -->
  <div id="keybar">
    <div class="k"      id="k-esc">ESC</div>
    <div class="k"      id="k-tab">&#8677;</div>
    <div class="k mod"  id="k-ctrl">CTRL</div>
    <div class="k mod"  id="k-alt">ALT</div>
    <div class="k"      id="k-dash">-</div>
    <div class="k arrow" id="k-up">↑</div>
    <div class="k arrow" id="k-down">↓</div>
    <div class="k arrow" id="k-left">←</div>
    <div class="k arrow" id="k-right">→</div>
  </div>

  <!-- Number row -->
  <div id="numrow">
    <div class="k num" data-i="1">1</div>
    <div class="k num" data-i="2">2</div>
    <div class="k num" data-i="3">3</div>
    <div class="k num" data-i="4">4</div>
    <div class="k num" data-i="5">5</div>
    <div class="k num" data-i="6">6</div>
    <div class="k num" data-i="7">7</div>
    <div class="k num" data-i="8">8</div>
    <div class="k num" data-i="9">9</div>
    <div class="k num" data-i="0">0</div>
  </div>
</div>

<script>
'use strict';

// ── Kali / Termux colour theme ────────────────────────────────────────────────
var THEME = {
  background:          '#000000',
  foreground:          '#f8f8f2',
  cursor:              '#00ff41',
  cursorAccent:        '#000000',
  selectionBackground: 'rgba(100,200,100,0.25)',
  black:   '#000000', red:     '#ff5555',
  green:   '#55ff55', yellow:  '#f1fa8c',
  blue:    '#6272a4', magenta: '#ff79c6',
  cyan:    '#8be9fd', white:   '#f8f8f2',
  brightBlack:   '#555555', brightRed:     '#ff6e6e',
  brightGreen:   '#69ff47', brightYellow:  '#ffffa5',
  brightBlue:    '#d6acff', brightMagenta: '#ff92df',
  brightCyan:    '#a4ffff', brightWhite:   '#ffffff',
};

// ── Modifier state ─────────────────────────────────────────────────────────────
var ctrlOn = false;
var altOn  = false;

function setCtrl(v) {
  ctrlOn = v;
  document.getElementById('k-ctrl').classList.toggle('on', v);
}
function setAlt(v) {
  altOn = v;
  document.getElementById('k-alt').classList.toggle('on', v);
}

// ── xterm setup ───────────────────────────────────────────────────────────────
var term = new Terminal({
  cursorBlink:       true,
  cursorStyle:       'block',
  fontSize:          14,
  fontFamily:        '"Courier New", Courier, monospace',
  lineHeight:        1.2,
  scrollback:        50000,
  allowTransparency: true,
  theme:             THEME,
  disableStdin:      false,
  convertEol:        false,
  macOptionIsMeta:   true,
});

var fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('tinner'));

// Intercept key events for CTRL/ALT modifier handling
term.attachCustomKeyEventHandler(function(e) {
  if (e.type !== 'keydown') return true;

  if (ctrlOn) {
    var key = e.key;
    // Single printable character — apply ctrl
    if (key.length === 1) {
      var upper = key.toUpperCase();
      var code  = upper.charCodeAt(0) - 64;
      if (code >= 1 && code <= 26) {
        socket.emit('input', String.fromCharCode(code));
      } else {
        socket.emit('input', key);
      }
      setCtrl(false);
      return false;
    }
    // Special keys while CTRL on
    if (key === 'Enter')     { socket.emit('input', '\x0d'); setCtrl(false); return false; }
    if (key === 'Backspace') { socket.emit('input', '\x08'); setCtrl(false); return false; }
  }

  if (altOn) {
    var key2 = e.key;
    if (key2.length === 1) {
      socket.emit('input', '\x1b' + key2);
      setAlt(false);
      return false;
    }
    if (key2 === 'Enter') { socket.emit('input', '\x1b\x0d'); setAlt(false); return false; }
  }

  return true; // let xterm handle normally
});

// Forward all terminal input to socket
term.onData(function(data) {
  socket.emit('input', data);
});

// ── Socket ────────────────────────────────────────────────────────────────────
var socket = io({ transports: ['websocket', 'polling'], reconnectionAttempts: 15 });

socket.on('connect', function() {
  try { fit.fit(); socket.emit('resize', { cols: term.cols, rows: term.rows }); } catch(e) {}
  term.focus();
});

socket.on('output', function(data) {
  term.write(data);
});

socket.on('disconnect', function() {
  term.write('\r\n\x1b[31m[disconnected — reconnecting…]\x1b[0m\r\n');
});

// ── Resize ────────────────────────────────────────────────────────────────────
function doFit() {
  try { fit.fit(); socket.emit('resize', { cols: term.cols, rows: term.rows }); } catch(e) {}
}

var ro = new ResizeObserver(doFit);
ro.observe(document.getElementById('tinner'));

window.addEventListener('resize', doFit);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', doFit);
}

// ── Tap terminal to open keyboard ─────────────────────────────────────────────
document.getElementById('terminal').addEventListener('click', function() {
  term.focus();
});
document.getElementById('terminal').addEventListener('touchend', function(e) {
  if (window.getSelection && window.getSelection().toString()) return;
  e.preventDefault();
  term.focus();
}, { passive: false });

// ── Key bar actions ───────────────────────────────────────────────────────────
function bindKey(id, action) {
  var el = document.getElementById(id);
  if (!el) return;

  function trigger(e) {
    e.preventDefault();
    el.classList.add('active-flash');
    setTimeout(function() { el.classList.remove('active-flash'); }, 120);
    action();
  }

  el.addEventListener('touchstart', trigger, { passive: false });
  el.addEventListener('mousedown',  trigger, false);
}

bindKey('k-esc',   function() { socket.emit('input', '\x1b');   term.focus(); });
bindKey('k-tab',   function() { socket.emit('input', '\t');     term.focus(); });
bindKey('k-dash',  function() { socket.emit('input', '-');      term.focus(); });
bindKey('k-up',    function() { socket.emit('input', '\x1b[A'); term.focus(); });
bindKey('k-down',  function() { socket.emit('input', '\x1b[B'); term.focus(); });
bindKey('k-left',  function() { socket.emit('input', '\x1b[D'); term.focus(); });
bindKey('k-right', function() { socket.emit('input', '\x1b[C'); term.focus(); });

// CTRL / ALT toggles
bindKey('k-ctrl', function() {
  setAlt(false);
  setCtrl(!ctrlOn);
  term.focus();
});
bindKey('k-alt', function() {
  setCtrl(false);
  setAlt(!altOn);
  term.focus();
});

// Number row
document.querySelectorAll('#numrow .k').forEach(function(el) {
  function triggerNum(e) {
    e.preventDefault();
    var ch = el.dataset.i;
    if (ctrlOn) {
      // CTRL + number — send the digit
      socket.emit('input', ch);
      setCtrl(false);
    } else {
      socket.emit('input', ch);
    }
    term.focus();
  }
  el.addEventListener('touchstart', triggerNum, { passive: false });
  el.addEventListener('mousedown',  triggerNum, false);
});

// ── Boot ──────────────────────────────────────────────────────────────────────
setTimeout(function() { doFit(); term.focus(); }, 100);
</script>
</body>
</html>
