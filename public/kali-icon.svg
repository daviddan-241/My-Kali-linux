<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="60" y="80" width="392" height="320" rx="20" fill="#111" stroke="#222" stroke-width="2"/>
  <rect x="60" y="80" width="392" height="36" rx="20" fill="#1c1c1c"/>
  <rect x="60" y="100" width="392" height="16" fill="#1c1c1c"/>
  <circle cx="96" cy="98" r="8" fill="#ff5f56"/>
  <circle cx="122" cy="98" r="8" fill="#ffbd2e"/>
  <circle cx="148" cy="98" r="8" fill="#27c93f"/>
  <text x="90" y="178" font-family="'Courier New',Courier,monospace" font-size="32" font-weight="bold" fill="#34c759" filter="url(#glow)">root@kali:~</text>
  <text x="90" y="178" font-family="'Courier New',Courier,monospace" font-size="32" font-weight="bold" fill="#34c759">#</text>
  <rect x="90" y="188" width="3" height="32" rx="1" fill="#34c759" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="90" y="248" font-family="'Courier New',Courier,monospace" font-size="22" fill="#555">nmap -sV 10.0.0.1</text>
  <text x="90" y="280" font-family="'Courier New',Courier,monospace" font-size="20" fill="#34c759">Starting Nmap 7.94...</text>
  <text x="90" y="308" font-family="'Courier New',Courier,monospace" font-size="20" fill="#555">80/tcp  open  http</text>
  <text x="90" y="334" font-family="'Courier New',Courier,monospace" font-size="20" fill="#555">443/tcp open  https</text>
  <text x="256" y="448" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="36" font-weight="bold" fill="#34c759" letter-spacing="8" filter="url(#glow)">KALI</text>
</svg>
